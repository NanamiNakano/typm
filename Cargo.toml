[workspace]
members = ["typst-args"]

[workspace.dependencies]
typst-syntax = "0.15.1"
typst-utils = "=0.15.1"
typst-args = { path = "typst-args" }

[package]
name = "typm"
version = "0.1.2"
edition = "2024"
description = "An experimental package manager for typst"
license = "MIT"
homepage = "https://github.com/NanamiNakano/typm"
repository = "https://github.com/NanamiNakano/typm"
readme = "README.md"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
directories = "6.0.0"
git2 = { version = "0.21.0", default-features = false, features = [
    "https",
    "ssh",
    "vendored-libgit2",
    "vendored-openssl",
] }
indicatif = "0.18.6"
pathdiff = "0.2.3"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
snafu = "0.9.2"
tempfile = "3.27.0"
toml = "1.1.6"
toml_edit = "0.25.15"
typst-syntax.workspace = true
typst-args.workspace = true
url = "2.5.8"
walkdir = "2.5.0"
